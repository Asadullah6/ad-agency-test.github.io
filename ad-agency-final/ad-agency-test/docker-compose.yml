# =============================================================
# File: docker-compose.yml (project root)
# Usage: docker compose up --build
# =============================================================

version: '3.9'

services:
  # ── PostgreSQL Database ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: admetrics_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       admetrics_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admetrics_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT:           5000
      NODE_ENV:       production
      DB_HOST:        postgres
      DB_PORT:        5432
      DB_NAME:        admetrics_db
      DB_USER:        postgres
      DB_PASSWORD:    postgres
      JWT_SECRET:     change_this_in_production_please
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN:    http://localhost:3000
      AI_SERVICE_URL: http://ai-service:4000
    ports:
      - '5000:5000'

  # ── AI Microservice ─────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: admetrics_ai
    restart: unless-stopped
    environment:
      PORT:            4000
      NODE_ENV:        production
      OPENAI_API_KEY:  ${OPENAI_API_KEY}   # pass from host env
      OPENAI_MODEL:    gpt-4o-mini
      CORS_ORIGIN:     http://localhost:5000,http://localhost:3000
    ports:
      - '4000:4000'

volumes:
  postgres_data:
